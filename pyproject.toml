[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay-bench"
version = "0.1.0"
description = "Deterministic offline replay diagnostics for synthetic agent traces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-replay-bench = "agent_replay_bench.cli:main"

[tool.setuptools]
packages = ["agent_replay_bench"]
